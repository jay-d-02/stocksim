name: CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: stocksim
          POSTGRES_PASSWORD: stocksim
          POSTGRES_DB: market_sim_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U stocksim" --health-interval 3s --health-timeout 3s --health-retries 20
      redis:
        image: redis:7-alpine
        ports: ["6379:6379"]
        options: >-
          --health-cmd "redis-cli ping" --health-interval 3s --health-timeout 3s --health-retries 20
    env:
      DATABASE_URL: postgresql+psycopg://stocksim:stocksim@localhost:5432/market_sim_test
      REDIS_URL: redis://localhost:6379/15
      SECRET_KEY: ci-secret
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-dev.txt
      - run: pip install -r requirements-dev.txt
      - name: 단위 + 통합 테스트 (마이그레이션 포함)
        run: pytest -o addopts="" -q
      - name: 이미지 빌드 확인
        run: docker build --target app -t market-sim .
